<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Header">
	<f:render partial="Header/All" arguments="{_all}" />
</f:section>
<f:section name="Main">
	<f:render partial="Videos/Assets" arguments="{playlist: 1}" />

	<div class="player-container tx-videos__player">
		<div class="vjs-player-wrapper">
			<video id="video{data.uid}" class="video-js vjs-big-play-centered vjs-fluid" controls preload="auto" crossorigin="anonymous">
				<p class="vjs-no-js"><f:translate key="LLL:EXT:videos/Resources/Private/Language/locallang.xlf:javascript_disabled" /></p>
			</video>
		</div>

		<div class="playlist-container">
			<div class="vjs-playlist"></div>
		</div>
	</div>

	<f:asset.script identifier="videos-playlist-{data.uid}" useNonce="1">
		var player{data.uid} = videojs('video{data.uid}');
		player{data.uid}.playlist({videos -> f:format.raw()});
		player{data.uid}.playlistUi();
		player{data.uid}.markers();
	</f:asset.script>
</f:section>
</html>
